<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام - بردخون عکس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }
        .btn-admin {
            background: linear-gradient(135deg, #FF6584, #FF4757) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3) !important;
        }
        .btn-admin:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4) !important;
        }
        #cart-link {
            background: #6C63FF;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
        }
        #cart-count {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 1px 9px;
            font-size: 13px;
            margin-right: 5px;
        }

        .auth-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 60px;
            background: linear-gradient(135deg, #f5f7ff 0%, #e8ecff 100%);
        }
        .auth-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px 45px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .auth-icon {
            font-size: 60px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }
        .auth-box h2 {
            font-size: 30px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
            color: #2D3436;
        }
        .auth-box h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #636E72;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #2D3436;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #DFE6E9;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
            background: #fff;
            box-sizing: border-box;
            color: #2D3436;
        }
        .form-group input:focus {
            border-color: #6C63FF;
            outline: none;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }
        .form-group input::placeholder {
            color: #b0b0b0;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.35);
            text-align: center;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.5);
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            color: #636E72;
        }
        .auth-footer a {
            color: #6C63FF;
            font-weight: 700;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }

        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2D3436;
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: all 0.5s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            max-width: 90%;
            text-align: center;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .notification.success {
            background: linear-gradient(135deg, #2ECC71, #27ae60);
        }
        .notification.error {
            background: linear-gradient(135deg, #E74C3C, #c0392b);
        }

        footer {
            background: #2D3436;
            color: #fff;
            padding: 35px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .social a {
            color: #fff;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social a:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo {
                font-size: 20px;
            }
            nav {
                gap: 10px;
            }
            nav a {
                font-size: 13px;
            }
            #cart-link {
                padding: 5px 12px;
                font-size: 13px;
            }
            .btn-login {
                padding: 5px 14px !important;
                font-size: 13px !important;
            }
            .btn-admin {
                padding: 5px 14px !important;
                font-size: 13px !important;
            }
            .auth-box {
                padding: 28px 20px;
            }
            .auth-box h2 {
                font-size: 24px;
            }
            footer {
                padding: 25px 20px;
            }
        }
        @media (max-width: 480px) {
            .auth-box {
                padding: 20px 16px;
            }
            .auth-box .form-group input {
                padding: 12px 14px;
                font-size: 14px;
            }
            nav a {
                font-size: 12px;
            }
            #cart-link {
                font-size: 12px;
                padding: 4px 10px;
            }
            .btn-login {
                font-size: 12px !important;
                padding: 4px 12px !important;
            }
            .btn-admin {
                font-size: 12px !important;
                padding: 4px 12px !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html" id="cart-link">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="admin.html" class="btn-admin">⚙️ مدیریت</a>
            <a href="login.html" class="btn-login">ورود</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-box">
            <span class="auth-icon">📝</span>
            <h2>ثبت‌نام در <span>بردخون عکس</span></h2>
            <p class="subtitle">عضو شوید و از مزایای ویژه بهره‌مند شوید</p>
            <form id="register-form">
                <div class="form-group">
                    <label>👤 نام و نام خانوادگی</label>
                    <input type="text" id="reg-name" placeholder="مثلاً: علی محمدی" required>
                </div>
                <div class="form-group">
                    <label>📱 شماره موبایل</label>
                    <input type="tel" id="reg-phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
                </div>
                <div class="form-group">
                    <label>✉️ ایمیل (اختیاری)</label>
                    <input type="email" id="reg-email" placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label>🔒 رمز عبور</label>
                    <input type="password" id="reg-password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
                </div>
                <div class="form-group">
                    <label>🔒 تکرار رمز عبور</label>
                    <input type="password" id="reg-password-confirm" placeholder="تکرار رمز عبور" required>
                </div>
                <button type="submit" class="btn-primary">✨ ثبت‌نام</button>
            </form>
            <div class="auth-footer">
                قبلاً ثبت‌نام کردید؟ <a href="login.html">وارد شوید</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.querySelectorAll('#cart-count').forEach(el => {
                if (el) el.textContent = count;
            });
        }

        function showNotification(message, type = 'success') {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = `notification ${type}`;
            div.textContent = message;
            document.body.appendChild(div);

            requestAnimationFrame(() => {
                div.classList.add('show');
            });

            setTimeout(() => {
                div.classList.remove('show');
                setTimeout(() => div.remove(), 500);
            }, 3500);
        }

        function handleRegister(e) {
            e.preventDefault();

            const name = document.getElementById('reg-name');
            const phone = document.getElementById('reg-phone');
            const email = document.getElementById('reg-email');
            const password = document.getElementById('reg-password');
            const confirm = document.getElementById('reg-password-confirm');

            if (!name || !phone || !password || !confirm) {
                showNotification('لطفاً همه فیلدها را پر کنید!', 'error');
                return;
            }

            const nameVal = name.value.trim();
            const phoneVal = phone.value.trim();
            const emailVal = email ? email.value.trim() : '';
            const passwordVal = password.value;
            const confirmVal = confirm.value;

            if (!nameVal || !phoneVal || !passwordVal) {
                showNotification('لطفاً همه فیلدهای ضروری را پر کنید!', 'error');
                return;
            }

            if (passwordVal.length < 6) {
                showNotification('رمز عبور باید حداقل ۶ کاراکتر باشد!', 'error');
                return;
            }

            if (passwordVal !== confirmVal) {
                showNotification('رمز عبور و تکرار آن مطابقت ندارند!', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('users')) || [];

            if (users.find(u => u.phone === phoneVal)) {
                showNotification('این شماره قبلاً ثبت شده است!', 'error');
                return;
            }

            const newUser = {
                name: nameVal,
                phone: phoneVal,
                email: emailVal,
                password: passwordVal,
                date: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            currentUser = newUser;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));

            showNotification('✅ ثبت‌نام با موفقیت انجام شد! خوش آمدید ' + nameVal);

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();

            const registerForm = document.getElementById('register-form');
            if (registerForm) {
                registerForm.addEventListener('submit', handleRegister);
            }

            if (currentUser) {
                document.querySelectorAll('.btn-login').forEach(el => {
                    el.textContent = `👤 ${currentUser.name}`;
                    el.href = '#';
                    el.style.cursor = 'pointer';
                    el.onclick = (e) => {
                        e.preventDefault();
                        if (confirm('آیا می‌خواهید از حساب خود خارج شوید؟')) {
                            localStorage.removeItem('currentUser');
                            showNotification('🚪 از حساب خود خارج شدید', 'error');
                            setTimeout(() => window.location.href = 'index.html', 1000);
                        }
                    };
                });
            }
        });
    </script>

</body>
</html>
