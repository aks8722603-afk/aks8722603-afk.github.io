<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-box">
            <h2>📝 ثبت‌نام در بردخون عکس</h2>
            <p>عضو شوید و از مزایای ویژه بهره‌مند شوید</p>
            <form id="register-form">
                <div class="form-group">
                    <label>نام و نام خانوادگی</label>
                    <input type="text" id="reg-name" placeholder="مثلاً: علی محمدی" required>
                </div>
                <div class="form-group">
                    <label>شماره موبایل</label>
                    <input type="tel" id="reg-phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="reg-email" placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="reg-password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
                </div>
                <div class="form-group">
                    <label>تکرار رمز عبور</label>
                    <input type="password" id="reg-password-confirm" placeholder="تکرار رمز عبور" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">ثبت‌نام</button>
            </form>
            <p style="margin-top:15px;text-align:center;">
                قبلاً ثبت‌نام کردید؟ <a href="login.html" style="color:var(--primary);font-weight:700;">وارد شوید</a>
            </p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
