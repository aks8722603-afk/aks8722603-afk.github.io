<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید پرداخت - بردخون عکس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .icon {
            font-size: 70px;
            display: block;
            margin-bottom: 15px;
        }
        h2 {
            margin-bottom: 10px;
        }
        p {
            color: #636E72;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #6C63FF;
            color: #fff;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
        }
        .ref-id {
            font-size: 18px;
            background: #f8f9fe;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .success-text {
            color: #2ECC71;
        }
        .error-text {
            color: #E74C3C;
        }
    </style>
</head>
<body>
    <div class="container" id="result">
        <span class="icon">⏳</span>
        <h2>در حال بررسی پرداخت...</h2>
        <p>لطفاً چند لحظه صبر کنید</p>
    </div>

    <script>
        // ============================================
        // 🔐 کد مرچنت زرین‌پال
        // ============================================
        const MERCHANT_ID = '84b2b4e0-e560-48da-92cf-e7a69776d68c';
        const VERIFY_URL = 'https://payment.zarinpal.com/pg/v4/payment/verify.json';

        document.addEventListener('DOMContentLoaded', async function() {
            const resultDiv = document.getElementById('result');
            const urlParams = new URLSearchParams(window.location.search);
            const authority = urlParams.get('Authority');
            const status = urlParams.get('Status');
            const amount = parseInt(localStorage.getItem('paymentAmount')) || 0;

            // ============================================
            // بررسی وضعیت بازگشت از درگاه
            // ============================================
            if (status !== 'OK' || !authority) {
                resultDiv.innerHTML = `
                    <span class="icon">❌</span>
                    <h2 class="error-text">پرداخت ناموفق!</h2>
                    <p>تراکنش توسط کاربر لغو شد یا با خطا مواجه شد.</p>
                    <p style="font-size:13px;color:#b0b0b0;">وضعیت: ${status || 'نامشخص'}</p>
                    <br>
                    <a href="cart.html" class="btn">بازگشت به سبد خرید</a>
                `;
                return;
            }

            try {
                // ============================================
                // 📤 تأیید پرداخت با زرین‌پال (طبق مستندات)
                // ============================================
                const response = await fetch(VERIFY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        merchant_id: MERCHANT_ID,
                        amount: amount,
                        authority: authority,
                    })
                });

                const data = await response.json();

                // ============================================
                // 📥 بررسی نتیجه تأیید
                // ============================================
                if (data.data && data.data.code === 100) {
                    // پرداخت موفق
                    const refId = data.data.ref_id;

                    // پاک کردن سبد خرید
                    localStorage.removeItem('cart');
                    localStorage.removeItem('payAmount');
                    localStorage.removeItem('paymentAuthority');
                    localStorage.removeItem('paymentAmount');

                    resultDiv.innerHTML = `
                        <span class="icon">✅</span>
                        <h2 class="success-text">پرداخت با موفقیت انجام شد!</h2>
                        <div class="ref-id">شماره پیگیری: <strong>${refId}</strong></div>
                        <p style="font-size:14px;color:#636E72;">از خرید شما متشکریم!</p>
                        <br>
                        <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
                    `;
                } else if (data.data && data.data.code === 101) {
                    // تراکنش قبلاً تأیید شده است
                    resultDiv.innerHTML = `
                        <span class="icon">✅</span>
                        <h2 class="success-text">پرداخت قبلاً تأیید شده است!</h2>
                        <p>این تراکنش قبلاً با موفقیت انجام شده است.</p>
                        <br>
                        <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
                    `;
                } else {
                    // پرداخت ناموفق
                    const errorCode = data.data?.code || 'نامشخص';
                    resultDiv.innerHTML = `
                        <span class="icon">❌</span>
                        <h2 class="error-text">پرداخت ناموفق!</h2>
                        <p>کد خطا: ${errorCode}</p>
                        <br>
                        <a href="cart.html" class="btn">تلاش مجدد</a>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <span class="icon">❌</span>
                    <h2 class="error-text">خطا در تأیید پرداخت</h2>
                    <p>لطفاً با پشتیبانی تماس بگیرید.</p>
                    <br>
                    <a href="cart.html" class="btn">بازگشت</a>
                `;
            }
        });
    </script>

</body>
</html>
