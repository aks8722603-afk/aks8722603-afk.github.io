<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید پرداخت - بردخون عکس</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .icon { font-size: 70px; display: block; margin-bottom: 15px; }
        h2 { margin-bottom: 10px; }
        p { color: #636E72; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            background: #6C63FF;
            color: #fff;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(108,99,255,0.4); }
        .success { color: #2ECC71; }
        .error { color: #E74C3C; }
        .loading { color: #F39C12; }
    </style>
</head>
<body>
    <div class="container" id="result">
        <span class="icon">⏳</span>
        <h2>در حال بررسی پرداخت...</h2>
        <p>لطفاً چند لحظه صبر کنید</p>
    </div>

    <script>
        // ============================================
        // 🔐 کد مرچنت زرین‌پال
        // ============================================
        const MERCHANT_ID = '84b2b4e0-e560-48da-92cf-e7a69776d68c';

        document.addEventListener('DOMContentLoaded', async function() {
            const resultDiv = document.getElementById('result');
            const urlParams = new URLSearchParams(window.location.search);
            const authority = urlParams.get('Authority');
            const status = urlParams.get('Status');
            const amount = parseInt(localStorage.getItem('paymentAmount')) || 0;

            if (status !== 'OK' || !authority) {
                resultDiv.innerHTML = `
                    <span class="icon">❌</span>
                    <h2 style="color:#E74C3C;">پرداخت ناموفق!</h2>
                    <p>تراکنش توسط کاربر لغو شد یا با خطا مواجه شد.</p>
                    <a href="cart.html" class="btn">بازگشت به سبد خرید</a>
                `;
                return;
            }

            try {
                const response = await fetch('https://api.zarinpal.com/pg/v4/payment/verify.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        merchant_id: MERCHANT_ID,
                        amount: amount,
                        authority: authority,
                    })
                });

                const data = await response.json();

                if (data.data && data.data.code === 100) {
                    // پرداخت موفق
                    localStorage.removeItem('cart');
                    localStorage.removeItem('payAmount');
                    localStorage.removeItem('paymentAuthority');
                    localStorage.removeItem('paymentAmount');

                    resultDiv.innerHTML = `
                        <span class="icon">✅</span>
                        <h2 style="color:#2ECC71;">پرداخت با موفقیت انجام شد!</h2>
                        <p>شماره پیگیری: <strong>${data.data.ref_id}</strong></p>
                        <p style="font-size:14px;color:#636E72;">از خرید شما متشکریم!</p>
                        <br>
                        <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <span class="icon">❌</span>
                        <h2 style="color:#E74C3C;">پرداخت ناموفق!</h2>
                        <p>کد خطا: ${data.data?.code || 'نامشخص'}</p>
                        <a href="cart.html" class="btn">تلاش مجدد</a>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <span class="icon">❌</span>
                    <h2 style="color:#E74C3C;">خطا در تأیید پرداخت</h2>
                    <p>لطفاً با پشتیبانی تماس بگیرید.</p>
                    <a href="cart.html" class="btn">بازگشت</a>
                `;
            }
        });
    </script>
</body>
</html>
