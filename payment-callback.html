<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید پرداخت - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید</a>
        </nav>
    </header>

    <section class="payment-section" style="max-width:600px;margin:120px auto 60px;padding:0 20px;">
        <div class="payment-box" id="verify-result">
            <div style="text-align:center;padding:40px 20px;">
                <div style="font-size:50px;">⏳</div>
                <h3>در حال بررسی پرداخت...</h3>
                <p style="color:var(--gray);">لطفاً چند لحظه صبر کنید</p>
            </div>
        </div>
    </section>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const resultDiv = document.getElementById('verify-result');
        const urlParams = new URLSearchParams(window.location.search);
        const authority = urlParams.get('Authority');
        const status = urlParams.get('Status');
        const amount = parseInt(localStorage.getItem('paymentAmount')) || 0;
        
        // ⚠️ مرچنت کد خود را وارد کنید
        const merchantId = '84b2b4e0-e560-48da-92cf-e7a69776d68c';

        if (status !== 'OK' || !authority) {
            resultDiv.innerHTML = `
                <div style="text-align:center;padding:40px 20px;" class="error">
                    <div style="font-size:60px;">❌</div>
                    <h3>پرداخت ناموفق!</h3>
                    <p style="color:var(--gray);">تراکنش توسط کاربر لغو شد یا با خطا مواجه شد.</p>
                    <br>
                    <a href="cart.html" class="btn-primary" style="display:inline-block;">بازگشت به سبد خرید</a>
                </div>
            `;
            resultDiv.className = 'error';
            return;
        }

        try {
            const response = await fetch('https://api.zarinpal.com/pg/v4/payment/verify.json', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    merchant_id: merchantId,
                    amount: amount,
                    authority: authority,
                })
            });

            const data = await response.json();

            if (data.data && data.data.code === 100) {
                const refId = data.data.ref_id;
                
                localStorage.removeItem('cart');
                localStorage.removeItem('payAmount');
                localStorage.removeItem('paymentAuthority');
                localStorage.removeItem('paymentAmount');
                
                resultDiv.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;" class="success">
                        <div style="font-size:60px;">✅</div>
                        <h3>پرداخت با موفقیت انجام شد!</h3>
                        <p style="font-size:18px;color:#155724;">شماره پیگیری: <strong>${refId}</strong></p>
                        <p style="color:#155724;font-size:14px;">از خرید شما متشکریم!</p>
                        <br>
                        <a href="index.html" class="btn-primary" style="display:inline-block;">بازگشت به صفحه اصلی</a>
                    </div>
                `;
                resultDiv.className = 'success';
            } else {
                resultDiv.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;" class="error">
                        <div style="font-size:60px;">❌</div>
                        <h3>پرداخت ناموفق!</h3>
                        <p style="color:var(--gray);">کد خطا: ${data.data?.code || 'نامشخص'}</p>
                        <br>
                        <a href="cart.html" class="btn-primary" style="display:inline-block;">تلاش مجدد</a>
                    </div>
                `;
                resultDiv.className = 'error';
            }
        } catch (error) {
            console.error('Error verifying payment:', error);
            resultDiv.innerHTML = `
                <div style="text-align:center;padding:40px 20px;" class="error">
                    <div style="font-size:60px;">❌</div>
                    <h3>خطا در تأیید پرداخت</h3>
                    <p style="color:var(--gray);">لطفاً با پشتیبانی تماس بگیرید.</p>
                    <br>
                    <a href="cart.html" class="btn-primary" style="display:inline-block;">بازگشت</a>
                </div>
            `;
            resultDiv.className = 'error';
        }
    });
    </script>
</body>
</html>
