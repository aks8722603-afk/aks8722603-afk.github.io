<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات - بردخون عکس</title>
    <style>
        /* ============================================
           همه استایل‌ها در همین فایل
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
        }
        
        /* هدر */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }
        .btn-admin {
            background: linear-gradient(135deg, #FF6584, #FF4757) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3) !important;
        }
        .btn-admin:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4) !important;
        }
        #cart-link {
            background: #6C63FF;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
        }
        #cart-link:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
        }
        #cart-count {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 1px 9px;
            font-size: 13px;
            margin-right: 5px;
        }

        /* بخش محصولات */
        .products-section {
            max-width: 1200px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .products-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .products-header h2 {
            font-size: 36px;
            font-weight: 900;
        }
        .products-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .products-header p {
            color: #636E72;
            font-size: 17px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .product-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
        }
        .product-card .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #FF6584, #FF4757);
            color: #fff;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
        }
        .product-card .product-image {
            font-size: 70px;
            display: block;
            margin: 10px 0;
        }
        .product-card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
            color: #2D3436;
        }
        .product-card .description {
            color: #636E72;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .product-card .price {
            font-size: 24px;
            font-weight: 900;
            color: #6C63FF;
            margin: 15px 0;
        }
        .product-card .price span {
            font-size: 14px;
            font-weight: 400;
            color: #636E72;
        }
        .btn-add {
            background: linear-gradient(135deg, #2ECC71, #27ae60);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.4);
        }
        .btn-add:active {
            transform: scale(0.95);
        }

        /* فوتر */
        footer {
            background: #2D3436;
            color: #fff;
            padding: 35px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .social a {
            color: #fff;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social a:hover {
            opacity: 1;
            transform: translateY(-3px);
        }
        .trust-badges {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 20px 0 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        .badge-item {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .badge-item:hover {
            transform: translateY(-5px);
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.1));
        }
        .badge-item img {
            height: 60px;
            width: auto;
            object-fit: contain;
            background: #fff;
            padding: 5px 10px;
            border-radius: 10px;
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ECC71;
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            font-size: 16px;
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo {
                font-size: 20px;
            }
            nav {
                gap: 10px;
            }
            nav a {
                font-size: 13px;
            }
            #cart-link {
                padding: 5px 12px;
                font-size: 13px;
            }
            .btn-login {
                padding: 5px 14px !important;
                font-size: 13px !important;
            }
            .btn-admin {
                padding: 5px 14px !important;
                font-size: 13px !important;
            }
            .trust-badges {
                gap: 15px;
                padding: 10px;
            }
            .badge-item img {
                height: 45px;
                padding: 3px 8px;
            }
            footer {
                padding: 25px 20px;
            }
        }
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .products-header h2 {
                font-size: 26px;
            }
            .trust-badges {
                gap: 10px;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .badge-item img {
                height: 35px;
                padding: 2px 5px;
            }
            nav a {
                font-size: 12px;
            }
            #cart-link {
                font-size: 12px;
                padding: 4px 10px;
            }
            .btn-login {
                font-size: 12px !important;
                padding: 4px 12px !important;
            }
            .btn-admin {
                font-size: 12px !important;
                padding: 4px 12px !important;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- هدر                                          -->
    <!-- ============================================ -->
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html" id="cart-link">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="admin.html" class="btn-admin">⚙️ مدیریت</a>
            <a href="login.html" class="btn-login">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <!-- ============================================ -->
    <!-- محصولات                                      -->
    <!-- ============================================ -->
    <section class="products-section">
        <div class="products-header">
            <h2>🛍️ محصولات <span>بردخون عکس</span></h2>
            <p>۴ محصول ویژه با کیفیت عالی</p>
        </div>
        <div class="product-grid" id="product-grid">
            <!-- محصولات توسط جاوااسکریپت پر می‌شوند -->
        </div>
    </section>

    <!-- ============================================ -->
    <!-- فوتر                                         -->
    <!-- ============================================ -->
    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <div class="trust-badges">
            <div class="badge-item">
                <a href="https://trustseal.enamad.ir/?id=YOUR_CODE_HERE" target="_blank">
                    <img src="https://trustseal.enamad.ir/logo.aspx?id=YOUR_CODE_HERE" alt="اینماد">
                </a>
            </div>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <!-- ============================================ -->
    <!-- جاوااسکریپت (همان کد تست)                    -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // لیست محصولات
        // ============================================
        const products = [
            { 
                id: 1, 
                name: 'فلش مموری ۳۲ گیگ', 
                price: 7800000, 
                image: '💾', 
                description: 'سرعت بالا، مناسب برای ذخیره‌سازی عکس و فیلم',
                badge: 'پرفروش'
            },
            { 
                id: 2, 
                name: 'فلش مموری ۶۴ گیگ', 
                price: 9700000, 
                image: '💿', 
                description: 'ظرفیت بالا با سرعت فوق‌العاده',
                badge: 'ویژه'
            },
            { 
                id: 3, 
                name: 'قاب عکس ۲۱×۱۶', 
                price: 3500000, 
                image: '🖼️', 
                description: 'قاب چوبی با کیفیت، مناسب برای عکس‌های ۶×۴',
                badge: 'جدید'
            },
            { 
                id: 4, 
                name: 'قاب عکس ۲۰×۳۰', 
                price: 4500000, 
                image: '🖼️', 
                description: 'قاب مگنتی با طراحی مدرن',
                badge: 'تخفیف'
            }
        ];

        // ============================================
        // سبد خرید
        // ============================================
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const el = document.getElementById('cart-count');
            if (el) el.textContent = count;
        }

        function getProductById(id) {
            return products.find(p => p.id === id);
        }

        // ============================================
        // نوتیفیکیشن
        // ============================================
        function showNotification(message) {
            const old = document.querySelector('.notification');
            if (old) old.remove();
            
            const div = document.createElement('div');
            div.className = 'notification';
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // ============================================
        // ✅ افزودن به سبد خرید
        // ============================================
        function addToCart(productId) {
            console.log('📦 کلیک شد - محصول:', productId);
            
            const product = getProductById(productId);
            if (!product) {
                showNotification('❌ محصول یافت نشد!');
                return;
            }
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: productId, qty: 1 });
            }
            
            saveCart();
            showNotification(`✅ ${product.name} به سبد اضافه شد!`);
        }

        // ============================================
        // رندر محصولات
        // ============================================
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) {
                console.log('⚠️ product-grid پیدا نشد');
                return;
            }
            
            console.log('🔄 رندر محصولات...');
            let html = '';
            products.forEach(p => {
                html += `
                    <div class="product-card">
                        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                        <span class="product-image">${p.image}</span>
                        <h3>${p.name}</h3>
                        <p class="description">${p.description}</p>
                        <div class="price">${p.price.toLocaleString()} <span>تومان</span></div>
                        <button class="btn-add" onclick="addToCart(${p.id})">
                            ➕ افزودن به سبد
                        </button>
                    </div>
                `;
            });
            grid.innerHTML = html;
            console.log('✅ محصولات رندر شدند');
        }

        // ============================================
        // 🚀 اجرا در زمان بارگذاری
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ صفحه shop.html بارگذاری شد!');
            updateCartCount();
            renderProducts();
        });
    </script>

</body>
</html>
