<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-admin {
            background: linear-gradient(135deg, #FF6584, #FF4757) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3) !important;
        }
        .btn-admin:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4) !important;
        }
        .btn-admin::after {
            display: none !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="admin.html" class="btn-admin">⚙️ مدیریت</a>
            <a href="login.html" class="btn-login">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <section class="products" style="max-width:1200px;margin:120px auto 60px;padding:0 20px;">
        <div class="products-header" style="text-align:center;margin-bottom:40px;">
            <h2 style="font-size:36px;font-weight:900;">🛍️ محصولات <span style="background:linear-gradient(135deg,#6C63FF,#FF6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">بردخون عکس</span></h2>
            <p style="color:#636E72;font-size:17px;">۴ محصول ویژه با کیفیت عالی</p>
        </div>
        <div class="product-grid" id="product-grid">
            <!-- محصولات توسط جاوااسکریپت پر می‌شوند -->
        </div>
    </section>

    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <!-- ============================================ -->
    <!-- لینک کردن فایل script.js                      -->
    <!-- ============================================ -->
    <script src="script.js"></script>
</body>
</html>
