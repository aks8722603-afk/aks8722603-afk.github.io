<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات - بردخون عکس</title>
    <style>
        /* ============================================
           استایل‌های کامل
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
        }

        /* هدر */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }
        .btn-admin {
            background: linear-gradient(135deg, #FF6584, #FF4757) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3) !important;
        }
        .btn-admin:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4) !important;
        }
        .btn-change-pass {
            background: linear-gradient(135deg, #F39C12, #E67E22) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3) !important;
            transition: all 0.3s ease !important;
        }
        .btn-change-pass:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(243, 156, 18, 0.5) !important;
        }
        #cart-link {
            background: #6C63FF;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
        }
        #cart-count {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 1px 9px;
            font-size: 13px;
            margin-right: 5px;
        }

        /* محصولات */
        .products-section {
            max-width: 1200px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .products-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .products-header h2 {
            font-size: 36px;
            font-weight: 900;
        }
        .products-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .products-header p {
            color: #636E72;
            font-size: 17px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .product-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
        }

        .product-card .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #FF6584, #FF4757);
            color: #fff;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            z-index: 2;
        }

        .product-card .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            margin-bottom: 15px;
            background: #f5f7ff;
            transition: all 0.3s ease;
        }
        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
            color: #2D3436;
        }
        .product-card .description {
            color: #636E72;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .product-card .price {
            font-size: 24px;
            font-weight: 900;
            color: #6C63FF;
            margin: 15px 0;
        }
        .product-card .price span {
            font-size: 14px;
            font-weight: 400;
            color: #636E72;
        }

        .btn-add {
            background: linear-gradient(135deg, #2ECC71, #27ae60);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.4);
        }
        .btn-add:active {
            transform: scale(0.95);
        }

        .custom-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ECC71;
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            max-width: 90%;
            text-align: center;
        }

        /* فوتر */
        footer {
            background: #2D3436;
            color: #fff;
            padding: 35px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .social a {
            color: #fff;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social a:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo { font-size: 20px; }
            nav { gap: 10px; }
            nav a { font-size: 13px; }
            .btn-login { padding: 5px 14px !important; font-size: 13px !important; }
            .btn-admin { padding: 5px 14px !important; font-size: 13px !important; }
            .btn-change-pass { padding: 5px 14px !important; font-size: 13px !important; }
            #cart-link { padding: 5px 12px; font-size: 13px; }
            .products-section { margin: 100px auto 30px; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .product-card .product-image { height: 150px; }
            .product-card { padding: 15px 12px; }
            .product-card h3 { font-size: 15px; }
            .product-card .price { font-size: 18px; }
            .btn-add { font-size: 13px; padding: 8px 15px; }
        }

        @media (max-width: 480px) {
            .product-grid { grid-template-columns: 1fr; }
            .product-card .product-image { height: 200px; }
            .products-header h2 { font-size: 24px; }
            nav a { font-size: 12px; }
            .btn-login { font-size: 12px !important; padding: 4px 12px !important; }
            .btn-admin { font-size: 12px !important; padding: 4px 12px !important; }
            .btn-change-pass { font-size: 12px !important; padding: 4px 12px !important; }
            #cart-link { font-size: 12px; padding: 4px 10px; }
            .product-card .price { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- هدر                                          -->
    <!-- ============================================ -->
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html" id="cart-link">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="admin.html" class="btn-admin">⚙️ مدیریت</a>
            <a href="change-password.html" class="btn-change-pass">🔑 تغییر رمز</a>
            <a href="login.html" class="btn-login" id="login-btn">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <!-- ============================================ -->
    <!-- محصولات                                      -->
    <!-- ============================================ -->
    <section class="products-section">
        <div class="products-header">
            <h2>🛍️ محصولات <span>بردخون عکس</span></h2>
            <p>محصولات ویژه با کیفیت عالی</p>
        </div>
        <div class="product-grid" id="product-grid">
            <!-- محصولات توسط جاوااسکریپت پر می‌شوند -->
        </div>
    </section>

    <!-- ============================================ -->
    <!-- فوتر                                         -->
    <!-- ============================================ -->
    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <!-- ============================================ -->
    <!-- جاوااسکریپت                                  -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // 📦 دریافت محصولات از localStorage
        // ============================================
        function getProducts() {
            // ابتدا از localStorage بخوان
            let products = JSON.parse(localStorage.getItem('admin_products'));
            
            // اگر محصولی در localStorage نبود، از پیش‌فرض استفاده کن
            if (!products || products.length === 0) {
                products = [
                    { id: 1, name: 'فلش مموری ۱۶ گیگ', price: 6800000, image: '💾', description: 'سرعت بالا، مناسب برای ذخیره‌سازی عکس و فیلم', badge: 'پرفروش' },
                    { id: 2, name: 'فلش مموری ۳۲ گیگ', price: 8800000, image: '💿', description: 'ظرفیت بالا با سرعت فوق‌العاده', badge: 'ویژه' },
                    { id: 3, name: 'قاب عکس ۲۱×۱۶', price: 2600000, image: '🖼️', description: 'قاب پی وی سی با کیفیت', badge: 'جدید' },
                    { id: 4, name: 'قاب عکس ۲۰×۳۰', price: 3600000, image: '🖼️', description: 'قاب پی وی سی با کیفیت', badge: 'تخفیف' }
                ];
                // ذخیره در localStorage برای دفعات بعد
                localStorage.setItem('admin_products', JSON.stringify(products));
                localStorage.setItem('products', JSON.stringify(products));
            }
            
            return products;
        }

        // ============================================
        // مدیریت سبد خرید
        // ============================================
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const el = document.getElementById('cart-count');
            if (el) el.textContent = count;
        }

        function getProductById(id, products) {
            return products.find(p => p.id === id);
        }

        // ============================================
        // نوتیفیکیشن
        // ============================================
        function showNotification(message) {
            const old = document.querySelector('.custom-notification');
            if (old) old.remove();

            const div = document.createElement('div');
            div.className = 'custom-notification';
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // ============================================
        // ✅ افزودن به سبد خرید
        // ============================================
        function addToCart(productId) {
            const products = getProducts();
            const product = getProductById(productId, products);
            
            if (!product) {
                showNotification('❌ محصول یافت نشد!');
                return;
            }

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: productId, qty: 1 });
            }

            saveCart();
            showNotification('✅ ' + product.name + ' به سبد اضافه شد!');
        }

        // ============================================
        // رندر محصولات از localStorage
        // ============================================
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) return;

            const products = getProducts();
            
            if (products.length === 0) {
                grid.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;grid-column:1/-1;">
                        <div style="font-size:60px;margin-bottom:15px;">🛍️</div>
                        <h3 style="color:#636E72;">هیچ محصولی وجود ندارد!</h3>
                        <p style="color:#b0b0b0;">از پنل مدیریت محصولات خود را اضافه کنید.</p>
                        <br>
                        <a href="admin.html" style="display:inline-block;background:linear-gradient(135deg,#6C63FF,#5a52d5);color:#fff;padding:12px 35px;border-radius:50px;text-decoration:none;font-weight:700;">رفتن به پنل مدیریت</a>
                    </div>
                `;
                return;
            }

            let html = '';
            products.forEach(function(p) {
                html += `
                    <div class="product-card">
                        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                        <img src="${p.image}" alt="${p.name}" class="product-image" onerror="this.style.display='none'">
                        <h3>${p.name}</h3>
                        <p class="description">${p.description || 'توضیحی وارد نشده'}</p>
                        <div class="price">${p.price.toLocaleString()} <span>ریال</span></div>
                        <button class="btn-add" onclick="addToCart(${p.id})">
                            ➕ افزودن به سبد
                        </button>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // ============================================
        // خروج از حساب
        // ============================================
        function logout() {
            localStorage.removeItem('currentUser');
            showNotification('🚪 از حساب خود خارج شدید');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }

        // ============================================
        // اجرا
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ صفحه محصولات بارگذاری شد');
            updateCartCount();
            renderProducts();

            // نمایش نام کاربر در هدر
            if (currentUser) {
                const loginBtn = document.getElementById('login-btn');
                if (loginBtn) {
                    loginBtn.textContent = `👤 ${currentUser.name}`;
                    loginBtn.href = '#';
                    loginBtn.style.cursor = 'pointer';
                    loginBtn.onclick = (e) => {
                        e.preventDefault();
                        if (confirm('آیا می‌خواهید از حساب خود خارج شوید؟')) {
                            logout();
                        }
                    };
                }
            }
        });
    </script>

</body>
</html>
