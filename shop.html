<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-admin {
            background: linear-gradient(135deg, #FF6584, #FF4757) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3) !important;
        }
        .btn-admin:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4) !important;
        }
        .btn-admin::after {
            display: none !important;
        }

        .products-section {
            max-width: 1200px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .products-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .products-header h2 {
            font-size: 36px;
            font-weight: 900;
        }
        .products-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .products-header p {
            color: #636E72;
            font-size: 17px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .product-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
        }

        .product-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #FF6584, #FF4757);
            color: #fff;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
        }

        /* ============================================
           اندازه عکس محصولات - اینجا را تغییر دهید
           ============================================ */
        .product-card .product-image {
            width: 100%;
            height: 160px;           /* ← ارتفاع عکس */
            object-fit: cover;
            border-radius: 12px;
            display: block;
            margin-bottom: 12px;
            background: #f5f7ff;
            transition: all 0.3s ease;
        }
        .product-card:hover .product-image {
            transform: scale(1.03);
        }

        .product-card h3 {
            font-size: 17px;
            font-weight: 700;
            margin: 8px 0 4px;
            color: #2D3436;
        }
        .product-card .description {
            color: #636E72;
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .product-card .price {
            font-size: 22px;
            font-weight: 900;
            color: #6C63FF;
            margin: 12px 0;
        }
        .product-card .price span {
            font-size: 13px;
            font-weight: 400;
            color: #636E72;
        }

        .btn-add {
            background: linear-gradient(135deg, #2ECC71, #27ae60);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.4);
        }
        .btn-add:active {
            transform: scale(0.95);
        }

        .custom-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ECC71;
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            font-size: 16px;
            max-width: 90%;
            text-align: center;
        }

        /* هدر */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }
        #cart-link {
            background: #6C63FF;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
        }
        #cart-count {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 1px 9px;
            font-size: 13px;
            margin-right: 5px;
        }

        /* فوتر */
        footer {
            background: #2D3436;
            color: #fff;
            padding: 35px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .social a {
            color: #fff;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social a:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo { font-size: 20px; }
            nav { gap: 10px; }
            nav a { font-size: 13px; }
            .btn-login { padding: 5px 14px !important; font-size: 13px !important; }
            .btn-admin { padding: 5px 14px !important; font-size: 13px !important; }
            #cart-link { padding: 5px 12px; font-size: 13px; }
            .products-section { margin: 100px auto 30px; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .product-card .product-image { height: 130px; }
            .product-card { padding: 15px 12px; }
            .product-card h3 { font-size: 15px; }
            .product-card .price { font-size: 18px; }
            .btn-add { font-size: 13px; padding: 8px 15px; }
        }

        @media (max-width: 480px) {
            .product-grid { grid-template-columns: 1fr; }
            .product-card .product-image { height: 180px; }
            .products-header h2 { font-size: 24px; }
            nav a { font-size: 12px; }
            .btn-login { font-size: 12px !important; padding: 4px 12px !important; }
            .btn-admin { font-size: 12px !important; padding: 4px 12px !important; }
            #cart-link { font-size: 12px; padding: 4px 10px; }
            .product-card .price { font-size: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html" id="cart-link">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="admin.html" class="btn-admin">⚙️ مدیریت</a>
            <a href="login.html" class="btn-login">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <section class="products-section">
        <div class="products-header">
            <h2>🛍️ محصولات <span>بردخون عکس</span></h2>
            <p>۴ محصول ویژه با کیفیت عالی</p>
        </div>
        <div class="product-grid" id="product-grid">
            <!-- محصولات توسط جاوااسکریپت پر می‌شوند -->
        </div>
    </section>

    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <script>
        // ============================================
        // لیست محصولات
        // ============================================
        const products = [
            { 
                id: 1, 
                name: 'فلش مموری ۳۲ گیگ', 
                price: 180000, 
                image: 'images/flash32.jpg',
                description: 'سرعت بالا، مناسب برای ذخیره‌سازی عکس و فیلم',
                badge: 'پرفروش'
            },
            { 
                id: 2, 
                name: 'فلش مموری ۶۴ گیگ', 
                price: 290000, 
                image: 'images/flash64.jpg',
                description: 'ظرفیت بالا با سرعت فوق‌العاده',
                badge: 'ویژه'
            },
            { 
                id: 3, 
                name: 'قاب عکس ۲۱×۱۶', 
                price: 85000, 
                image: 'images/frame1621.jpg',
                description: 'قاب چوبی با کیفیت، مناسب برای عکس‌های ۶×۴',
                badge: 'جدید'
            },
            { 
                id: 4, 
                name: 'قاب عکس ۲۰×۳۰', 
                price: 120000, 
                image: 'images/frame2030.jpg',
                description: 'قاب مگنتی با طراحی مدرن',
                badge: 'تخفیف'
            }
        ];

        // ============================================
        // مدیریت سبد خرید
        // ============================================
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.querySelectorAll('#cart-count').forEach(el => {
                if (el) el.textContent = count;
            });
        }

        function getProductById(id) {
            return products.find(p => p.id === id);
        }

        function showNotification(message) {
            const old = document.querySelector('.custom-notification');
            if (old) old.remove();
            
            const div = document.createElement('div');
            div.className = 'custom-notification';
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function addToCart(productId) {
            const product = getProductById(productId);
            if (!product) {
                showNotification('❌ محصول یافت نشد!');
                return;
            }
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: productId, qty: 1 });
            }
            saveCart();
            showNotification(`✅ ${product.name} به سبد اضافه شد!`);
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            
            let html = '';
            products.forEach(p => {
                html += `
                    <div class="product-card">
                        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                        <img src="${p.image}" alt="${p.name}" class="product-image" onerror="this.style.display='none'">
                        <h3>${p.name}</h3>
                        <p class="description">${p.description}</p>
                        <div class="price">${p.price.toLocaleString()} <span>تومان</span></div>
                        <button class="btn-add" onclick="addToCart(${p.id})">
                            ➕ افزودن به سبد
                        </button>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            renderProducts();
        });
    </script>
</body>
</html>
