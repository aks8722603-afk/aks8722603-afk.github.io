<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - بردخون عکس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }

        /* ============================================ */
        /* صفحه ورود به پنل مدیریت                      */
        /* ============================================ */
        .admin-login {
            max-width: 400px;
            margin: 150px auto 60px;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
            text-align: center;
        }
        .admin-login .lock-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
        .admin-login h2 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #2D3436;
        }
        .admin-login p {
            color: #636E72;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .admin-login input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #DFE6E9;
            border-radius: 12px;
            font-size: 16px;
            margin: 10px 0;
            box-sizing: border-box;
            font-family: inherit;
            text-align: center;
        }
        .admin-login input:focus {
            border-color: #6C63FF;
            outline: none;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            margin-top: 5px;
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.5);
        }
        .error-msg {
            color: #E74C3C;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        /* ============================================ */
        /* پنل مدیریت                                   */
        /* ============================================ */
        .admin-container {
            max-width: 1200px;
            margin: 100px auto 60px;
            padding: 0 20px;
        }
        .admin-box {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
        }
        .admin-box h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            text-align: center;
            color: #2D3436;
        }
        .admin-box h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-item {
            background: linear-gradient(135deg, #f8f9fe, #e8ecff);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.15);
        }
        .stat-item .number {
            font-size: 32px;
            font-weight: 900;
            color: #6C63FF;
        }
        .stat-item .label {
            color: #636E72;
            font-size: 14px;
            margin-top: 5px;
        }
        .stat-item .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 5px;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #6C63FF;
            color: #fff;
            padding: 12px 15px;
            text-align: right;
            white-space: nowrap;
        }
        th:first-child {
            border-radius: 0 10px 0 0;
        }
        th:last-child {
            border-radius: 10px 0 0 0;
        }
        td {
            padding: 10px 15px;
            border-bottom: 1px solid #DFE6E9;
        }
        tr:hover td {
            background: #f8f9fe;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #636E72;
        }
        .empty-state .big-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
        }
        .badge-count {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 13px;
            margin-right: 5px;
        }

        .admin-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .btn-danger {
            background: #E74C3C;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #636E72;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover {
            background: #2D3436;
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2D3436;
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: all 0.5s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            max-width: 90%;
            text-align: center;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .notification.success {
            background: linear-gradient(135deg, #2ECC71, #27ae60);
        }
        .notification.error {
            background: linear-gradient(135deg, #E74C3C, #c0392b);
        }

        footer {
            background: #2D3436;
            color: #fff;
            padding: 25px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
            }
            .logo {
                font-size: 20px;
            }
            nav {
                gap: 10px;
            }
            nav a {
                font-size: 13px;
            }
            .admin-box {
                padding: 20px;
            }
            .stat-card {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .stat-card {
                grid-template-columns: 1fr;
            }
            .admin-login {
                padding: 25px 20px;
                margin: 100px 15px 30px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- هدر                                          -->
    <!-- ============================================ -->
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید</a>
            <a href="login.html" class="btn-login">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <!-- ============================================ -->
    <!-- صفحه ورود به پنل                             -->
    <!-- ============================================ -->
    <div id="admin-login" class="admin-login">
        <span class="lock-icon">🔐</span>
        <h2>پنل مدیریت</h2>
        <p>برای ورود رمز عبور را وارد کنید</p>
        <input type="password" id="admin-password" placeholder="رمز عبور مدیریت">
        <button class="btn-primary" onclick="checkLogin()">🚀 ورود</button>
        <div id="login-error" class="error-msg">❌ رمز عبور اشتباه است!</div>
    </div>

    <!-- ============================================ -->
    <!-- پنل مدیریت                                   -->
    <!-- ============================================ -->
    <div id="admin-panel" class="admin-container hidden">
        <div class="admin-box">
            <h2>📊 پنل مدیریت <span>بردخون عکس</span></h2>

            <!-- کارت‌های آمار -->
            <div class="stat-card">
                <div class="stat-item">
                    <span class="icon">👤</span>
                    <div class="number" id="total-users">۰</div>
                    <div class="label">تعداد کاربران</div>
                </div>
                <div class="stat-item">
                    <span class="icon">🛒</span>
                    <div class="number" id="total-products">۰</div>
                    <div class="label">تعداد محصولات</div>
                </div>
                <div class="stat-item">
                    <span class="icon">📦</span>
                    <div class="number" id="total-orders">۰</div>
                    <div class="label">تعداد سفارشات</div>
                </div>
            </div>

            <!-- لیست کاربران -->
            <h3 style="margin-top:30px;">👥 لیست کاربران <span class="badge-count" id="user-count-badge">۰</span></h3>
            <div class="table-wrap">
                <div id="user-list-container">
                    <div class="empty-state">
                        <span class="big-icon">⏳</span>
                        <p>در حال بارگذاری...</p>
                    </div>
                </div>
            </div>

            <!-- دکمه‌ها -->
            <div class="admin-actions">
                <button class="btn-danger" onclick="logoutAdmin()">🚪 خروج از پنل</button>
                <button class="btn-secondary" onclick="refreshData()">🔄 بروزرسانی</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <!-- ============================================ -->
    <!-- جاوااسکریپت                                  -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // 🔐 رمز عبور مدیریت
        // ============================================
        const ADMIN_PASSWORD = 'admin123';

        // ============================================
        // 🔑 ورود
        // ============================================
        function checkLogin() {
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('login-error');

            if (password === ADMIN_PASSWORD) {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                errorEl.classList.remove('show');
                sessionStorage.setItem('adminLoggedIn', 'true');
                loadData();
            } else {
                errorEl.classList.add('show');
                document.getElementById('admin-password').value = '';
                document.getElementById('admin-password').focus();
            }
        }

        // ============================================
        // 🚪 خروج
        // ============================================
        function logoutAdmin() {
            if (confirm('آیا می‌خواهید از پنل مدیریت خارج شوید؟')) {
                sessionStorage.removeItem('adminLoggedIn');
                document.getElementById('admin-login').style.display = 'block';
                document.getElementById('admin-panel').classList.add('hidden');
                document.getElementById('admin-password').value = '';
                document.getElementById('login-error').classList.remove('show');
            }
        }

        // ============================================
        // 📊 بارگذاری داده‌ها
        // ============================================
        function loadData() {
            // دریافت کاربران
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // نمایش تعداد کاربران
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('user-count-badge').textContent = users.length;

            // محصولات
            const products = JSON.parse(localStorage.getItem('products')) || [];
            document.getElementById('total-products').textContent = products.length;

            // سفارشات
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            document.getElementById('total-orders').textContent = orders.length;

            // نمایش لیست کاربران
            const container = document.getElementById('user-list-container');
            if (users.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><span class="big-icon">👤</span><p>هنوز کاربری ثبت‌نام نکرده است!</p></div>`;
                return;
            }

            let html = `<table><thead><tr>
                <th>#</th><th>نام</th><th>شماره موبایل</th><th>ایمیل</th><th>🔑 رمز عبور</th>
            </tr></thead><tbody>`;

            users.forEach(function(user, index) {
                html += `<tr>
                    <td>${index + 1}</td>
                    <td><strong>${user.name}</strong></td>
                    <td>${user.phone}</td>
                    <td>${user.email || '—'}</td>
                    <td style="font-family:monospace;color:#E74C3C;font-weight:700;">${user.password}</td>
                </tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // 🔄 بروزرسانی
        // ============================================
        function refreshData() {
            loadData();
            showNotification('✅ داده‌ها بروزرسانی شدند!');
        }

        // ============================================
        // 📢 نوتیفیکیشن
        // ============================================
        function showNotification(message, type) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = 'notification show';
            div.textContent = message;
            if (type === 'success') {
                div.style.background = 'linear-gradient(135deg, #2ECC71, #27ae60)';
            } else if (type === 'error') {
                div.style.background = 'linear-gradient(135deg, #E74C3C, #c0392b)';
            }
            document.body.appendChild(div);

            setTimeout(function() {
                div.classList.remove('show');
                setTimeout(function() { div.remove(); }, 500);
            }, 3000);
        }

        // ============================================
        // 🚀 اجرا
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // اگر قبلاً وارد شده بودید
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                loadData();
            }

            // ورود با کلید Enter
            document.getElementById('admin-password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkLogin();
                }
            });
        });
    </script>

</body>
</html>
