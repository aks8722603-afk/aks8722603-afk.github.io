<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - بردخون عکس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }

        /* ============================================ */
        /* صفحه ورود                                    */
        /* ============================================ */
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: 50px auto;
        }
        .login-box h2 {
            color: #2D3436;
            margin-bottom: 10px;
        }
        .login-box p {
            color: #636E72;
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            border: 2px solid #DFE6E9;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        .login-box input:focus {
            border-color: #6C63FF;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-box button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
        }
        .error-msg {
            color: #E74C3C;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        /* ============================================ */
        /* پنل مدیریت                                   */
        /* ============================================ */
        .panel {
            display: none;
            max-width: 1100px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
            margin: 0 auto;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2ff;
        }
        .panel-header h2 {
            color: #2D3436;
            font-size: 28px;
        }
        .panel-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-logout {
            background: #E74C3C;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }
        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        .stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-item {
            background: #f8f9fe;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 28px;
            font-weight: 900;
            color: #6C63FF;
        }
        .stat-item .label {
            color: #636E72;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th {
            background: #6C63FF;
            color: #fff;
            padding: 10px 12px;
            text-align: right;
        }
        th:first-child {
            border-radius: 0 10px 0 0;
        }
        th:last-child {
            border-radius: 10px 0 0 0;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #DFE6E9;
            vertical-align: middle;
        }
        tr:hover td {
            background: #f8f9fe;
        }
        .badge {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 13px;
            margin-right: 5px;
        }
        .section-title {
            margin-top: 25px;
            font-size: 18px;
            color: #2D3436;
        }
        .empty-msg {
            color: #636E72;
            text-align: center;
            padding: 20px;
        }

        /* ============================================ */
        /* فرم افزودن محصول                            */
        /* ============================================ */
        .add-product-form {
            background: #f8f9fe;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            display: none;
            border: 2px dashed #6C63FF;
        }
        .add-product-form.show {
            display: block;
        }
        .add-product-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .add-product-form .form-group {
            margin-bottom: 15px;
        }
        .add-product-form label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            color: #2D3436;
        }
        .add-product-form input,
        .add-product-form textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #DFE6E9;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .add-product-form input:focus,
        .add-product-form textarea:focus {
            border-color: #6C63FF;
            outline: none;
        }
        .btn-add-toggle {
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px 0;
        }
        .btn-add-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
        }
        .btn-save {
            background: #2ECC71;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }
        .btn-delete {
            background: #E74C3C;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .btn-edit-price {
            background: #F39C12;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .btn-edit-price:hover {
            background: #E67E22;
            transform: translateY(-2px);
        }
        .price-input {
            width: 120px;
            padding: 5px 10px;
            border: 2px solid #DFE6E9;
            border-radius: 8px;
            font-size: 14px;
        }
        .price-input:focus {
            border-color: #6C63FF;
            outline: none;
        }

        @media (max-width: 600px) {
            .panel-header {
                flex-direction: column;
                text-align: center;
            }
            .panel {
                padding: 20px;
            }
            table {
                font-size: 12px;
            }
            th,
            td {
                padding: 6px 8px;
            }
            .add-product-form .form-row {
                grid-template-columns: 1fr;
            }
            .price-input {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- صفحه ورود                                    -->
    <!-- ============================================ -->
    <div id="login-page" class="login-box">
        <h2>🔐 پنل مدیریت</h2>
        <p>برای ورود رمز عبور را وارد کنید</p>
        <input type="password" id="admin-password" placeholder="رمز عبور مدیریت">
        <button onclick="checkLogin()">🚀 ورود</button>
        <div id="login-error" class="error-msg">❌ رمز عبور اشتباه است!</div>
    </div>

    <!-- ============================================ -->
    <!-- پنل مدیریت                                   -->
    <!-- ============================================ -->
    <div id="admin-panel" class="panel">

        <!-- هدر پنل با دکمه خروج -->
        <div class="panel-header">
            <h2>📊 پنل مدیریت <span>بردخون عکس</span></h2>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 خروج از پنل</button>
        </div>

        <!-- آمار -->
        <div class="stat">
            <div class="stat-item">
                <div class="number" id="total-users">۰</div>
                <div class="label">👤 کاربران</div>
            </div>
            <div class="stat-item">
                <div class="number" id="total-products">۰</div>
                <div class="label">🛒 محصولات</div>
            </div>
            <div class="stat-item">
                <div class="number" id="total-orders">۰</div>
                <div class="label">📦 سفارشات</div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- مدیریت محصولات                             -->
        <!-- ========================================== -->
        <div class="section-title">
            🛍️ مدیریت محصولات <span class="badge" id="product-badge">۰</span>
            <button class="btn-add-toggle" onclick="toggleAddForm()">➕ افزودن محصول جدید</button>
        </div>

        <!-- فرم افزودن محصول -->
        <div id="add-product-form" class="add-product-form">
            <h4 style="margin-bottom:15px;">➕ افزودن محصول جدید</h4>
            <div class="form-row">
                <div class="form-group">
                    <label>نام محصول</label>
                    <input type="text" id="new-name" placeholder="مثلاً: فلش مموری ۱۲۸ گیگ">
                </div>
                <div class="form-group">
                    <label>قیمت (ریال)</label>
                    <input type="number" id="new-price" placeholder="مثلاً: 12000000">
                </div>
            </div>
            <div class="form-group">
                <label>توضیحات</label>
                <textarea id="new-desc" rows="2" placeholder="توضیحات محصول"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>آیکون یا عکس</label>
                    <input type="text" id="new-image" placeholder="مثلاً: 💾 یا images/product.jpg" value="📦">
                </div>
                <div class="form-group">
                    <label>برچسب (اختیاری)</label>
                    <input type="text" id="new-badge" placeholder="مثلاً: جدید، پرفروش، ویژه">
                </div>
            </div>
            <button class="btn-save" onclick="addProduct()">✅ افزودن محصول</button>
            <button style="background:#636E72;color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;margin-right:10px;" onclick="toggleAddForm()">❌ انصراف</button>
        </div>

        <!-- لیست محصولات -->
        <div id="product-list">
            <p class="empty-msg">در حال بارگذاری...</p>
        </div>

        <!-- ========================================== -->
        <!-- لیست کاربران                               -->
        <!-- ========================================== -->
        <div class="section-title" style="margin-top:30px;">👥 لیست کاربران <span class="badge" id="user-badge">۰</span></div>
        <div id="user-list">
            <p class="empty-msg">در حال بارگذاری...</p>
        </div>

        <!-- دکمه خروج در پایین -->
        <div style="text-align:center;margin-top:25px;padding-top:15px;border-top:2px solid #f0f2ff;">
            <button class="btn-logout" onclick="logoutAdmin()">🚪 خروج از پنل</button>
        </div>
    </div>

    <script>
        // ============================================
        // 🔐 رمز عبور مدیریت
        // ============================================
        const ADMIN_PASSWORD = 'admin123';

        // ============================================
        // 📦 محصولات
        // ============================================
        let products = [];

        function loadProducts() {
            const saved = localStorage.getItem('admin_products');
            if (saved) {
                products = JSON.parse(saved);
            } else {
                products = [
                    { id: 1, name: 'فلش مموری ۱۶ گیگ', price: 6800000, image: '💾',
                    description: 'سرعت بالا، مناسب برای ذخیره‌سازی عکس و فیلم', badge: 'پرفروش' },
                    { id: 2, name: 'فلش مموری ۳۲ گیگ', price: 8800000, image: '💿',
                    description: 'ظرفیت بالا با سرعت فوق‌العاده', badge: 'ویژه' },
                    { id: 3, name: 'قاب عکس ۲۱×۱۶', price: 2600000, image: '🖼️',
                    description: 'قاب پی وی سی با کیفیت', badge: 'جدید' },
                    { id: 4, name: 'قاب عکس ۲۰×۳۰', price: 3600000, image: '🖼️',
                    description: 'قاب پی وی سی با کیفیت', badge: 'تخفیف' }
                ];
                saveProducts();
            }
            return products;
        }

        function saveProducts() {
            localStorage.setItem('admin_products', JSON.stringify(products));
            localStorage.setItem('products', JSON.stringify(products));
        }

        // ============================================
        // 🔑 ورود
        // ============================================
        function checkLogin() {
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('login-error');

            if (password === ADMIN_PASSWORD) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                errorEl.classList.remove('show');
                sessionStorage.setItem('adminLoggedIn', 'true');
                loadData();
            } else {
                errorEl.classList.add('show');
                document.getElementById('admin-password').value = '';
                document.getElementById('admin-password').focus();
            }
        }

        // ============================================
        // 🚪 خروج
        // ============================================
        function logoutAdmin() {
            if (confirm('آیا از خروج از پنل مدیریت مطمئن هستید؟')) {
                sessionStorage.removeItem('adminLoggedIn');
                document.getElementById('login-page').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-password').value = '';
                document.getElementById('login-error').classList.remove('show');
                window.location.href = 'index.html';
            }
        }

        // ============================================
        // 📊 بارگذاری داده‌ها
        // ============================================
        function loadData() {
            loadProducts();

            // کاربران
            const users = JSON.parse(localStorage.getItem('users')) || [];
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('user-badge').textContent = users.length;

            // محصولات
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('product-badge').textContent = products.length;

            // سفارشات
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            document.getElementById('total-orders').textContent = orders.length;

            renderProducts();
            renderUsers(users);
        }

        // ============================================
        // 👥 نمایش کاربران
        // ============================================
        function renderUsers(users) {
            const container = document.getElementById('user-list');
            if (users.length === 0) {
                container.innerHTML = '<p class="empty-msg">هنوز کاربری ثبت‌نام نکرده است!</p>';
                return;
            }
            let html = '<table><thead><tr><th>#</th><th>نام</th><th>موبایل</th><th>🔑 رمز</th></tr></thead><tbody>';
            users.forEach((u, i) => {
                html +=
                    `<tr><td>${i+1}</td><td>${u.name}</td><td>${u.phone}</td><td style="font-family:monospace;color:#E74C3C;">${u.password}</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================
        // 🛍️ نمایش محصولات با امکان ویرایش
        // ============================================
        function renderProducts() {
            const container = document.getElementById('product-list');
            if (products.length === 0) {
                container.innerHTML = '<p class="empty-msg">هیچ محصولی وجود ندارد! اولین محصول را اضافه کنید.</p>';
                return;
            }
            let html = `<table>
                <thead><tr><th>#</th><th>نام</th><th>قیمت (ریال)</th><th>عملیات</th></tr></thead>
                <tbody>`;
            products.forEach((p, i) => {
                html += `
                    <tr>
                        <td>${i+1}</td>
                        <td>${p.name}</td>
                        <td>
                            <input type="number" class="price-input" id="price-${p.id}" value="${p.price}">
                        </td>
                        <td>
                            <button class="btn-edit-price" onclick="updatePrice(${p.id})">💾 ذخیره</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================
        // 💰 تغییر قیمت
        // ============================================
        function updatePrice(productId) {
            const input = document.getElementById('price-' + productId);
            const newPrice = parseInt(input.value);
            if (isNaN(newPrice) || newPrice < 0) {
                alert('❌ قیمت نامعتبر است!');
                return;
            }
            const product = products.find(p => p.id === productId);
            if (product) {
                product.price = newPrice;
                saveProducts();
                alert(`✅ قیمت ${product.name} به ${newPrice.toLocaleString()} ریال تغییر کرد!`);
                loadData(); // رفرش لیست
            }
        }

        // ============================================
        // ❌ حذف محصول
        // ============================================
        function deleteProduct(productId) {
            if (!confirm('آیا از حذف این محصول مطمئن هستید؟')) return;
            const product = products.find(p => p.id === productId);
            products = products.filter(p => p.id !== productId);
            saveProducts();
            alert(`🗑️ محصول "${product?.name}" حذف شد!`);
            loadData();
        }

        // ============================================
        // ➕ نمایش/مخفی کردن فرم افزودن محصول
        // ============================================
        function toggleAddForm() {
            const form = document.getElementById('add-product-form');
            form.classList.toggle('show');
            if (!form.classList.contains('show')) {
                // پاک کردن فرم
                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-desc').value = '';
                document.getElementById('new-image').value = '📦';
                document.getElementById('new-badge').value = '';
            }
        }

        // ============================================
        // ➕ افزودن محصول جدید
        // ============================================
        function addProduct() {
            const name = document.getElementById('new-name').value.trim();
            const price = parseInt(document.getElementById('new-price').value);
            const desc = document.getElementById('new-desc').value.trim();
            const image = document.getElementById('new-image').value.trim() || '📦';
            const badge = document.getElementById('new-badge').value.trim();

            if (!name || isNaN(price) || price < 0) {
                alert('❌ لطفاً نام و قیمت معتبر وارد کنید!');
                return;
            }

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({
                id: newId,
                name: name,
                price: price,
                image: image,
                description: desc || 'توضیحی وارد نشده',
                badge: badge
            });
            saveProducts();

            // پاک کردن فرم
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-desc').value = '';
            document.getElementById('new-image').value = '📦';
            document.getElementById('new-badge').value = '';
            document.getElementById('add-product-form').classList.remove('show');

            alert(`✅ محصول "${name}" با موفقیت اضافه شد!`);
            loadData();
        }

        // ============================================
        // 🚀 اجرا
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadData();
            }

            document.getElementById('admin-password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkLogin();
                }
            });
        });
    </script>

</body>
</html>
