<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - بردخون عکس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================ */
        /* صفحه ورود                                    */
        /* ============================================ */
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 {
            color: #2D3436;
            margin-bottom: 10px;
        }
        .login-box p {
            color: #636E72;
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            border: 2px solid #DFE6E9;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        .login-box input:focus {
            border-color: #6C63FF;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-box button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
        }
        .error-msg {
            color: #E74C3C;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        /* ============================================ */
        /* پنل مدیریت                                   */
        /* ============================================ */
        .panel {
            display: none;
            max-width: 1000px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2ff;
        }
        .panel-header h2 {
            color: #2D3436;
            font-size: 28px;
        }
        .panel-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-logout {
            background: #E74C3C;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }
        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        .stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-item {
            background: #f8f9fe;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 28px;
            font-weight: 900;
            color: #6C63FF;
        }
        .stat-item .label {
            color: #636E72;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th {
            background: #6C63FF;
            color: #fff;
            padding: 10px 12px;
            text-align: right;
        }
        th:first-child {
            border-radius: 0 10px 0 0;
        }
        th:last-child {
            border-radius: 10px 0 0 0;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #DFE6E9;
        }
        tr:hover td {
            background: #f8f9fe;
        }
        .badge {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 13px;
            margin-right: 5px;
        }
        .section-title {
            margin-top: 25px;
            font-size: 18px;
            color: #2D3436;
        }
        .empty-msg {
            color: #636E72;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .panel-header {
                flex-direction: column;
                text-align: center;
            }
            .panel {
                padding: 20px;
            }
            table {
                font-size: 12px;
            }
            th,
            td {
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- صفحه ورود                                    -->
    <!-- ============================================ -->
    <div id="login-page" class="login-box">
        <h2>🔐 پنل مدیریت</h2>
        <p>برای ورود رمز عبور را وارد کنید</p>
        <input type="password" id="admin-password" placeholder="رمز عبور مدیریت">
        <button onclick="checkLogin()">🚀 ورود</button>
        <div id="login-error" class="error-msg">❌ رمز عبور اشتباه است!</div>
    </div>

    <!-- ============================================ -->
    <!-- پنل مدیریت                                   -->
    <!-- ============================================ -->
    <div id="admin-panel" class="panel">

        <!-- هدر پنل با دکمه خروج -->
        <div class="panel-header">
            <h2>📊 پنل مدیریت <span>بردخون عکس</span></h2>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 خروج از پنل</button>
        </div>

        <!-- آمار -->
        <div class="stat">
            <div class="stat-item">
                <div class="number" id="total-users">۰</div>
                <div class="label">👤 کاربران</div>
            </div>
            <div class="stat-item">
                <div class="number" id="total-products">۰</div>
                <div class="label">🛒 محصولات</div>
            </div>
            <div class="stat-item">
                <div class="number" id="total-orders">۰</div>
                <div class="label">📦 سفارشات</div>
            </div>
        </div>

        <!-- لیست کاربران -->
        <div class="section-title">👥 لیست کاربران <span class="badge" id="user-badge">۰</span></div>
        <div id="user-list">
            <p class="empty-msg">در حال بارگذاری...</p>
        </div>

        <!-- لیست محصولات -->
        <div class="section-title">🛍️ لیست محصولات <span class="badge" id="product-badge">۰</span></div>
        <div id="product-list">
            <p class="empty-msg">در حال بارگذاری...</p>
        </div>

        <!-- دکمه خروج در پایین (تکرار برای اطمینان) -->
        <div style="text-align:center;margin-top:25px;padding-top:15px;border-top:2px solid #f0f2ff;">
            <button class="btn-logout" onclick="logoutAdmin()">🚪 خروج از پنل</button>
        </div>
    </div>

    <script>
        // ============================================
        // 🔐 رمز عبور مدیریت
        // ============================================
        const ADMIN_PASSWORD = 'admin123';

        // ============================================
        // 🔑 ورود
        // ============================================
        function checkLogin() {
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('login-error');

            if (password === ADMIN_PASSWORD) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                errorEl.classList.remove('show');
                sessionStorage.setItem('adminLoggedIn', 'true');
                loadData();
            } else {
                errorEl.classList.add('show');
                document.getElementById('admin-password').value = '';
                document.getElementById('admin-password').focus();
            }
        }

        // ============================================
        // 🚪 خروج
        // ============================================
        function logoutAdmin() {
            if (confirm('آیا از خروج از پنل مدیریت مطمئن هستید؟')) {
                sessionStorage.removeItem('adminLoggedIn');
                document.getElementById('login-page').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-password').value = '';
                document.getElementById('login-error').classList.remove('show');
                // هدایت به صفحه اصلی
                window.location.href = 'index.html';
            }
        }

        // ============================================
        // 📊 بارگذاری داده‌ها
        // ============================================
        function loadData() {
            // دریافت کاربران
            const users = JSON.parse(localStorage.getItem('users')) || [];
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('user-badge').textContent = users.length;

            // دریافت محصولات (از admin_products)
            let products = JSON.parse(localStorage.getItem('admin_products'));
            if (!products || products.length === 0) {
                products = [
                    { id: 1, name: 'فلش مموری ۱۶ گیگ', price: 6800000 },
                    { id: 2, name: 'فلش مموری ۳۲ گیگ', price: 8800000 },
                    { id: 3, name: 'قاب عکس ۲۱×۱۶', price: 2600000 },
                    { id: 4, name: 'قاب عکس ۲۰×۳۰', price: 3600000 }
                ];
                localStorage.setItem('admin_products', JSON.stringify(products));
            }
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('product-badge').textContent = products.length;

            // سفارشات
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            document.getElementById('total-orders').textContent = orders.length;

            // نمایش لیست کاربران
            const userContainer = document.getElementById('user-list');
            if (users.length === 0) {
                userContainer.innerHTML = '<p class="empty-msg">هنوز کاربری ثبت‌نام نکرده است!</p>';
            } else {
                let html = '<table><thead><tr><th>#</th><th>نام</th><th>موبایل</th><th>🔑 رمز</th></tr></thead><tbody>';
                users.forEach((u, i) => {
                    html +=
                        `<tr><td>${i+1}</td><td>${u.name}</td><td>${u.phone}</td><td style="font-family:monospace;color:#E74C3C;">${u.password}</td></tr>`;
                });
                html += '</tbody></table>';
                userContainer.innerHTML = html;
            }

            // نمایش لیست محصولات
            const productContainer = document.getElementById('product-list');
            if (products.length === 0) {
                productContainer.innerHTML = '<p class="empty-msg">هیچ محصولی وجود ندارد!</p>';
            } else {
                let html = '<table><thead><tr><th>#</th><th>نام محصول</th><th>قیمت (ریال)</th></tr></thead><tbody>';
                products.forEach((p, i) => {
                    html += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.price.toLocaleString()}</td></tr>`;
                });
                html += '</tbody></table>';
                productContainer.innerHTML = html;
            }
        }

        // ============================================
        // 🚀 اجرا
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // اگر قبلاً وارد شده بودیم
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadData();
            }

            // ورود با کلید Enter
            document.getElementById('admin-password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkLogin();
                }
            });
        });
    </script>

</body>
</html>
