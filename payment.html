<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت - بردخون عکس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: #f5f7ff;
            direction: rtl;
            min-height: 100vh;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }

        .payment-section {
            max-width: 700px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .payment-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .payment-header h2 {
            font-size: 34px;
            font-weight: 900;
        }
        .payment-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .payment-header p {
            color: #636E72;
            font-size: 16px;
        }

        .payment-box {
            background: #fff;
            border-radius: 20px;
            padding: 35px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        .payment-info {
            background: linear-gradient(135deg, #f8f9fe, #e8ecff);
            padding: 18px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .payment-info .amount {
            font-size: 24px;
            font-weight: 900;
            color: #6C63FF;
        }
        .payment-info .order-id {
            color: #636E72;
            font-size: 14px;
        }

        .payment-methods {
            margin: 20px 0;
        }
        .payment-methods h3 {
            margin-bottom: 12px;
            font-size: 17px;
        }
        .payment-methods label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            margin: 5px 8px 5px 0;
            background: #f5f7ff;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .payment-methods label:hover {
            border-color: #6C63FF;
        }
        .payment-methods input[type="radio"] {
            accent-color: #6C63FF;
            width: 18px;
            height: 18px;
        }

        .card-form {
            margin: 25px 0;
        }
        .card-form h3 {
            margin-bottom: 15px;
            font-size: 17px;
        }
        .card-form .form-group {
            margin-bottom: 15px;
        }
        .card-form input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #DFE6E9;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
            background: #fff;
            box-sizing: border-box;
        }
        .card-form input:focus {
            border-color: #6C63FF;
            outline: none;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }
        .card-form .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        #pay-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            margin-top: 10px;
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.35);
        }
        #pay-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.5);
        }

        #payment-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        #payment-result.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        #payment-result.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        #payment-result.loading {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }

        .payment-footer {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fe;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            color: #636E72;
        }

        footer {
            background: #2D3436;
            color: #fff;
            padding: 35px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .social a {
            color: #fff;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social a:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo {
                font-size: 20px;
            }
            nav {
                gap: 10px;
            }
            nav a {
                font-size: 13px;
            }
            .btn-login {
                padding: 5px 14px !important;
                font-size: 13px !important;
            }
            .payment-box {
                padding: 25px 20px;
            }
            .card-form .row {
                grid-template-columns: 1fr;
            }
            .payment-info {
                flex-direction: column;
                text-align: center;
            }
            footer {
                padding: 25px 20px;
            }
        }
        @media (max-width: 480px) {
            .payment-header h2 {
                font-size: 26px;
            }
            nav a {
                font-size: 12px;
            }
            .btn-login {
                font-size: 12px !important;
                padding: 4px 12px !important;
            }
            .payment-methods label {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید</a>
            <a href="login.html" class="btn-login">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <section class="payment-section">
        <div class="payment-header">
            <h2>💳 پرداخت با <span>زرین‌پال</span></h2>
            <p>فروشگاه بردخون عکس</p>
        </div>
        <div class="payment-box">
            <div class="payment-info">
                <div>
                    <span style="color:#636E72;">مبلغ قابل پرداخت</span>
                    <div class="amount" id="pay-amount">۰</div>
                </div>
                <div>
                    <span style="color:#636E72;">شماره سفارش</span>
                    <div class="order-id" id="order-id">۱۲۳۴۵۶</div>
                </div>
            </div>

            <div class="payment-methods">
                <h3>درگاه پرداخت:</h3>
                <div style="display:flex;gap:15px;flex-wrap:wrap;">
                    <label style="background:#fff;border:2px solid #6C63FF;">
                        <input type="radio" name="payment" value="zarinpal" checked>
                        <span style="font-weight:700;">🔵 زرین‌پال</span>
                    </label>
                </div>
            </div>

            <div class="card-form">
                <h3>اطلاعات کارت بانکی:</h3>
                <div class="form-group">
                    <input type="text" placeholder="شماره کارت (۱۶ رقمی)" maxlength="16" id="card-number">
                </div>
                <div class="row">
                    <div class="form-group">
                        <input type="text" placeholder="ماه/سال" maxlength="5" id="card-expire">
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="CVV2" maxlength="4" id="card-cvv">
                    </div>
                </div>
            </div>

            <button id="pay-btn">🔐 پرداخت با زرین‌پال</button>
            <div id="payment-result"></div>

            <div class="payment-footer">
                🔒 تمامی تراکنش‌ها توسط درگاه <strong>زرین‌پال</strong> انجام می‌شود.
            </div>
        </div>
    </section>

    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <script>
        // ============================================
        // 🔐 کد مرچنت زرین‌پال
        // ============================================
        const MERCHANT_ID = '84b2b4e0-e560-48da-92cf-e7a69776d68c';

        // ============================================
        // 🌐 آدرس بازگشت
        // ============================================
        const CALLBACK_URL = 'https://pay.bordekhon-aks.ir/payment-callback.html';

        document.addEventListener('DOMContentLoaded', function() {
            const amount = parseInt(localStorage.getItem('payAmount')) || 0;
            document.getElementById('pay-amount').textContent = amount.toLocaleString();
            document.getElementById('order-id').textContent = Math.floor(100000 + Math.random() * 900000);

            const payBtn = document.getElementById('pay-btn');
            const resultDiv = document.getElementById('payment-result');

            payBtn.addEventListener('click', async function() {
                const amount = parseInt(localStorage.getItem('payAmount')) || 0;

                if (amount <= 0) {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '❌ مبلغ قابل پرداخت نامعتبر است!';
                    return;
                }

                // بررسی اینکه آیا کاربر وارد شده است
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser) {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '❌ لطفاً ابتدا وارد حساب خود شوید!';
                    return;
                }

                resultDiv.className = 'loading';
                resultDiv.innerHTML = '⏳ در حال اتصال به درگاه زرین‌پال...';

                try {
                    // ============================================
                    // ارسال درخواست به زرین‌پال
                    // ============================================
                    const response = await fetch('https://api.zarinpal.com/pg/v4/payment/request.json', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            merchant_id: MERCHANT_ID,
                            amount: amount,
                            callback_url: CALLBACK_URL,
                            description: 'خرید از فروشگاه بردخون عکس - سفارش #' + document.getElementById('order-id')
                                .textContent,
                            metadata: {
                                mobile: currentUser?.phone || '',
                                email: currentUser?.email || '',
                            }
                        })
                    });

                    const data = await response.json();

                    // ============================================
                    // بررسی پاسخ زرین‌پال
                    // ============================================
                    if (data.data && data.data.code === 100) {
                        // موفق - هدایت به درگاه
                        const authority = data.data.authority;
                        localStorage.setItem('paymentAuthority', authority);
                        localStorage.setItem('paymentAmount', amount);
                        window.location.href = 'https://www.zarinpal.com/pg/StartPay/' + authority;
                    } else {
                        // نمایش خطاهای مختلف
                        let errorMessage = '❌ خطا در اتصال به درگاه پرداخت';
                        const code = data.data?.code;

                        if (code === -9) {
                            errorMessage = '❌ خطا: مبلغ وارد شده نامعتبر است (حداقل ۱,۰۰۰ تومان)';
                        } else if (code === -10) {
                            errorMessage = '❌ خطا: اطلاعات درگاه پرداخت کامل نیست';
                        } else if (code === -11) {
                            errorMessage = '❌ خطا: مرچنت کد معتبر نیست';
                        } else if (code === -12) {
                            errorMessage = '❌ خطا: آدرس بازگشت (Callback URL) معتبر نیست';
                        } else if (code === -13) {
                            errorMessage = '❌ خطا: درگاه پرداخت غیرفعال است';
                        } else if (code === -14) {
                            errorMessage = '❌ خطا: آدرس بازگشت با دامنه ثبت‌شده درگاه مطابقت ندارد';
                        } else if (code === -15) {
                            errorMessage = '❌ خطا: درگاه پرداخت با این مرچنت کد یافت نشد';
                        } else if (code === -16) {
                            errorMessage = '❌ خطا: تراکنش با خطا مواجه شد';
                        } else {
                            errorMessage += '<br><small>کد خطا: ' + (code || 'نامشخص') + '</small>';
                        }

                        resultDiv.className = 'error';
                        resultDiv.innerHTML = errorMessage;

                        // اضافه کردن دکمه بازگشت
                        if (code === -12 || code === -14) {
                            resultDiv.innerHTML +=
                                '<br><br><a href="cart.html" style="display:inline-block;background:#6C63FF;color:#fff;padding:10px 25px;border-radius:50px;text-decoration:none;font-weight:700;">بازگشت به سبد خرید</a>';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '❌ خطا در ارتباط با سرور زرین‌پال<br><small>لطفاً دوباره تلاش کنید</small>';
                }
            });
        });
    </script>

</body>
</html>
