<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید</a>
        </nav>
    </header>

    <section class="payment-section">
        <div class="payment-header">
            <h2>💳 پرداخت با <span>زرین‌پال</span></h2>
            <p>فروشگاه بردخون عکس</p>
        </div>
        <div class="payment-box">
            <div class="payment-info">
                <div>
                    <span style="color:var(--gray);">مبلغ قابل پرداخت</span>
                    <div class="amount" id="pay-amount">۰</div>
                </div>
                <div>
                    <span style="color:var(--gray);">شماره سفارش</span>
                    <div class="order-id" id="order-id">۱۲۳۴۵۶</div>
                </div>
            </div>

            <div class="payment-methods">
                <h3>درگاه پرداخت:</h3>
                <div style="display:flex;gap:15px;flex-wrap:wrap;">
                    <label>
                        <input type="radio" name="payment" value="zarinpal" checked>
                        <img src="https://www.zarinpal.com/assets/images/logo.png" alt="زرین‌پال" style="height:30px;">
                    </label>
                </div>
            </div>

            <div class="card-form">
                <h3>اطلاعات کارت بانکی:</h3>
                <div class="form-group">
                    <input type="text" placeholder="شماره کارت (۱۶ رقمی)" maxlength="16">
                </div>
                <div class="row">
                    <div class="form-group">
                        <input type="text" placeholder="ماه/سال" maxlength="5">
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="CVV2" maxlength="4">
                    </div>
                </div>
            </div>

            <button id="pay-btn" class="btn-primary" style="width:100%;">
                🔐 پرداخت با زرین‌پال
            </button>
            <div id="payment-result"></div>
            
            <div style="margin-top:20px;padding:15px;background:#f8f9fe;border-radius:12px;text-align:center;font-size:13px;color:var(--gray);">
                🔒 تمامی تراکنش‌ها توسط درگاه <strong>زرین‌پال</strong> انجام می‌شود.
            </div>
        </div>
    </section>

    <script src="zarinpal.js"></script>
</body>
</html>
