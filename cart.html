<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-admin {
            background: linear-gradient(135deg, #FF6584, #FF4757) !important;
            color: #fff !important;
            padding: 8px 18px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3) !important;
        }
        .btn-admin:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4) !important;
        }
        .btn-admin::after {
            display: none !important;
        }
        /* هدر */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 50px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #6C63FF;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2D3436;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
            padding: 5px 0;
            white-space: nowrap;
        }
        nav a:hover {
            color: #6C63FF;
        }
        .btn-login {
            border: 2px solid #6C63FF !important;
            color: #6C63FF !important;
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
            background: transparent !important;
            text-decoration: none !important;
        }
        .btn-login:hover {
            background: #6C63FF !important;
            color: #fff !important;
        }
        #cart-link {
            background: #6C63FF;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
        }
        #cart-count {
            background: #FF6584;
            color: #fff;
            border-radius: 50%;
            padding: 1px 9px;
            font-size: 13px;
            margin-right: 5px;
        }

        .cart-section {
            max-width: 900px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .cart-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .cart-header h2 {
            font-size: 34px;
            font-weight: 900;
        }
        .cart-header h2 span {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #cart-items {
            background: #fff;
            border-radius: 20px;
            padding: 20px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            min-height: 200px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #DFE6E9;
            gap: 15px;
            flex-wrap: wrap;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item .item-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
        }
        .cart-item .item-image {
            font-size: 36px;
        }
        .cart-item .item-details .item-name {
            font-weight: 700;
            font-size: 16px;
        }
        .cart-item .item-details .item-price {
            color: #6C63FF;
            font-weight: 700;
            font-size: 15px;
        }
        .cart-item .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-item .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f7ff;
            padding: 4px;
            border-radius: 50px;
        }
        .cart-item .qty-control button {
            background: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            color: #2D3436;
        }
        .cart-item .qty-control button:hover {
            background: #6C63FF;
            color: #fff;
            transform: scale(1.05);
        }
        .cart-item .qty-control span {
            font-weight: 700;
            font-size: 16px;
            min-width: 25px;
            text-align: center;
        }
        .cart-item .btn-remove {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.5;
        }
        .cart-item .btn-remove:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        #cart-total {
            background: #fff;
            border-radius: 20px;
            padding: 25px 30px;
            margin-top: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        #cart-total .total-info h3 {
            font-size: 20px;
        }
        #cart-total .total-info h3 span {
            color: #6C63FF;
            font-size: 28px;
        }
        #cart-total .total-info p {
            color: #636E72;
            font-size: 14px;
        }

        .cart-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        #checkout-btn {
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: #fff;
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.35);
        }
        #checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.5);
        }
        .btn-clear-cart {
            background: #E74C3C;
            color: #fff;
            border: none;
            padding: 14px 25px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.3);
        }
        .btn-clear-cart:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(231, 76, 60, 0.5);
        }

        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ECC71;
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            font-size: 16px;
        }
        .notification.error {
            background: #E74C3C;
        }

        footer {
            background: #2D3436;
            color: #fff;
            padding: 35px 50px;
            text-align: center;
            margin-top: 60px;
        }
        footer p {
            opacity: 0.7;
            font-size: 14px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .social a {
            color: #fff;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social a:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 15px;
                height: 70px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo { font-size: 20px; }
            nav { gap: 10px; }
            nav a { font-size: 13px; }
            .btn-login { padding: 5px 14px !important; font-size: 13px !important; }
            .btn-admin { padding: 5px 14px !important; font-size: 13px !important; }
            #cart-link { padding: 5px 12px; font-size: 13px; }
            #cart-total { flex-direction: column; text-align: center; }
            .cart-buttons { justify-content: center; width: 100%; }
            #checkout-btn { width: 100%; }
            .btn-clear-cart { width: 100%; }
            .cart-item { flex-direction: column; align-items: stretch; gap: 10px; }
            .cart-item .item-actions { justify-content: space-between; }
            footer { padding: 25px 20px; }
        }

        @media (max-width: 480px) {
            .cart-header h2 { font-size: 26px; }
            #cart-total .total-info h3 span { font-size: 22px; }
            nav a { font-size: 12px; }
            .btn-login { font-size: 12px !important; padding: 4px 12px !important; }
            .btn-admin { font-size: 12px !important; padding: 4px 12px !important; }
            #cart-link { font-size: 12px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html" id="cart-link">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="admin.html" class="btn-admin">⚙️ مدیریت</a>
            <a href="login.html" class="btn-login">ورود / ثبت‌نام</a>
        </nav>
    </header>

    <section class="cart-section">
        <div class="cart-header">
            <h2>🛒 سبد خرید <span>بردخون عکس</span></h2>
        </div>
        <div id="cart-items"></div>
        <div id="cart-total">
            <div class="total-info">
                <h3>جمع کل: <span id="total-price">۰</span> ریال</h3>
                <p>هزینه ارسال در ادامه محاسبه می‌شود</p>
            </div>
            <div class="cart-buttons">
                <button id="checkout-btn">پرداخت</button>
                <button class="btn-clear-cart" onclick="clearCart()">🗑️ خالی کردن سبد</button>
            </div>
        </div>
    </section>

    <footer>
        <div class="social">
            <a href="#">📱</a>
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">📷</a>
        </div>
        <p>© ۲۰۲۶ فروشگاه بردخون عکس - تمامی حقوق محفوظ است</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: 'فلش مموری ۳۲ گیگ', price: 180000, image: '💾' },
            { id: 2, name: 'فلش مموری ۶۴ گیگ', price: 290000, image: '💿' },
            { id: 3, name: 'قاب عکس ۲۱×۱۶', price: 85000, image: '🖼️' },
            { id: 4, name: 'قاب عکس ۲۰×۳۰', price: 120000, image: '🖼️' }
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.querySelectorAll('#cart-count').forEach(el => {
                if (el) el.textContent = count;
            });
        }

        function getProductById(id) {
            return products.find(p => p.id === id);
        }

        function showNotification(message, type = 'success') {
            const old = document.querySelector('.notification');
            if (old) old.remove();

            const div = document.createElement('div');
            div.className = `notification ${type}`;
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function clearCart() {
            if (cart.length === 0) {
                showNotification('🛒 سبد خرید قبلاً خالی است!', 'error');
                return;
            }

            if (confirm('⚠️ آیا مطمئن هستید که می‌خواهید سبد خرید را خالی کنید؟')) {
                cart = [];
                saveCart();
                renderCart();
                showNotification('🗑️ سبد خرید خالی شد!');
            }
        }

        function removeFromCart(productId) {
            const product = getProductById(productId);
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            renderCart();
            if (product) showNotification(`🗑️ ${product.name} حذف شد`, 'error');
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    removeFromCart(productId);
                    return;
                }
                saveCart();
                renderCart();
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-price');

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;">
                        <div style="font-size:70px;margin-bottom:15px;">🛒</div>
                        <h3 style="color:#636E72;">سبد خرید خالی است</h3>
                        <p style="color:#b0b0b0;">به صفحه محصولات بروید</p>
                        <br>
                        <a href="shop.html" style="display:inline-block;background:linear-gradient(135deg,#6C63FF,#5a52d5);color:#fff;padding:12px 35px;border-radius:50px;text-decoration:none;font-weight:700;">مشاهده محصولات</a>
                    </div>
                `;
                if (totalEl) totalEl.textContent = '۰';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                const product = getProductById(item.id);
                if (!product) return;
                const subtotal = product.price * item.qty;
                total += subtotal;

                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <span class="item-image">${product.image}</span>
                            <div class="item-details">
                                <div class="item-name">${product.name}</div>
                                <div class="item-price">${subtotal.toLocaleString()} ریال</div>
                            </div>
                        </div>
                        <div class="item-actions">
                            <div class="qty-control">
                                <button onclick="changeQty(${product.id}, -1)">−</button>
                                <span>${item.qty}</span>
                                <button onclick="changeQty(${product.id}, 1)">+</button>
                            </div>
                            <button class="btn-remove" onclick="removeFromCart(${product.id})">✕</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            if (totalEl) totalEl.textContent = total.toLocaleString();

            const checkoutBtn = document.getElementById('checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.onclick = () => {
                    if (cart.length === 0) {
                        showNotification('سبد خرید خالی است!', 'error');
                        return;
                    }
                    if (!currentUser) {
                        showNotification('لطفاً ابتدا وارد شوید!', 'error');
                        setTimeout(() => window.location.href = 'login.html', 1500);
                        return;
                    }
                    localStorage.setItem('payAmount', total);
                    window.location.href = 'payment.html';
                };
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            renderCart();
        });
    </script>

</body>
</html>
