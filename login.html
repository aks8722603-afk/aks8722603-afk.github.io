<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
            <a href="register.html" class="btn-login">ثبت‌نام</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-box">
            <span class="auth-icon">🔐</span>
            <h2>ورود به <span>بردخون عکس</span></h2>
            <p class="subtitle">خوش آمدید! لطفاً وارد شوید</p>
            <form id="login-form">
                <div class="form-group">
                    <label>📱 ایمیل یا شماره موبایل</label>
                    <input type="text" id="login-email" placeholder="example@email.com یا ۰۹۱۲۳۴۵۶۷۸۹" required>
                </div>
                <div class="form-group">
                    <label>🔒 رمز عبور</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">🚀 ورود</button>
            </form>
            <div class="auth-footer">
                حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
