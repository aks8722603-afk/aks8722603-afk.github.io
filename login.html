<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - بردخون عکس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">📸 بردخون عکس</div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="shop.html">محصولات</a>
            <a href="cart.html">🛒 سبد خرید (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-box">
            <h2>🔐 ورود به حساب</h2>
            <p>خوش آمدید! لطفاً وارد شوید</p>
            <form id="login-form">
                <div class="form-group">
                    <label>ایمیل یا شماره موبایل</label>
                    <input type="text" id="login-email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">ورود</button>
            </form>
            <p style="margin-top:15px;text-align:center;">
                حساب ندارید؟ <a href="register.html" style="color:var(--primary);font-weight:700;">ثبت‌نام کنید</a>
            </p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
